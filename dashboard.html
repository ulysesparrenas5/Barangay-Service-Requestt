<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Barangay Service Request</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">Barangay Service Request</span>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm">Log Out</button>
    </div>
  </nav>

  <div class="container py-4">
    <h2 class="fw-bold">Welcome, <span id="userName">...</span>!</h2>
    <p class="text-secondary">Role: <span id="userRole" class="badge text-bg-primary">...</span></p>

    <div id="message"></div>

<!-- ADMIN VIEW -->
<div id="adminView" class="d-none">

  <!-- Summary cards -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="card app-card p-3 text-center">
        <small class="text-secondary">Total</small>
        <h3 id="countTotal" class="fw-bold mb-0">0</h3>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card app-card p-3 text-center">
        <small class="text-secondary">Pending</small>
        <h3 id="countPending" class="fw-bold mb-0 text-warning">0</h3>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card app-card p-3 text-center">
        <small class="text-secondary">In Progress</small>
        <h3 id="countProgress" class="fw-bold mb-0 text-info">0</h3>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card app-card p-3 text-center">
        <small class="text-secondary">Resolved</small>
        <h3 id="countResolved" class="fw-bold mb-0 text-success">0</h3>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <!-- AI Insights -->
    <div class="col-lg-4">
      <div class="card app-card p-4">
        <h5 class="fw-bold">🤖 AI Insights</h5>
        <p id="aiSummary" class="small text-secondary">Loading...</p>
        <div id="categoryBars"></div>
      </div>
    </div>

    <!-- All requests -->
    <div class="col-lg-8">
      <div class="card app-card p-4">
        <h5 class="fw-bold">All Requests</h5>
        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <input type="text" id="searchInput" class="form-control" placeholder="Search name, title or description...">
          </div>
          <div class="col-md-3">
            <select id="categoryFilter" class="form-select">
              <option value="">All categories</option>
            </select>
          </div>
          <div class="col-md-3">
            <select id="statusFilter" class="form-select">
              <option value="">All statuses</option>
              <option>Pending</option>
              <option>In Progress</option>
              <option>Resolved</option>
            </select>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr><th>Resident</th><th>Request</th><th>Category</th><th>Status</th><th>Date</th><th></th></tr>
            </thead>
            <tbody id="adminTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
    <!-- RESIDENT VIEW -->
    <div id="residentView" class="row g-4 d-none">

      <!-- Submit form -->
      <div class="col-lg-4">
        <div class="card app-card p-4">
          <h5 class="fw-bold">Submit a Request</h5>
          <form id="requestForm" novalidate>
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input type="text" id="title" class="form-control" maxlength="100" placeholder="e.g., Sirang poste ng ilaw">
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea id="description" class="form-control" rows="4" maxlength="1000" placeholder="Describe your concern..."></textarea>
            </div>
            <button type="submit" id="submitBtn" class="btn btn-primary w-100">Submit Request</button>
          </form>
        </div>
      </div>

      <!-- My requests table -->
      <div class="col-lg-8">
        <div class="card app-card p-4">
          <h5 class="fw-bold">My Requests</h5>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr><th>Request</th><th>Category</th><th>Status</th><th>Date</th><th>Actions</th></tr>
              </thead>
              <tbody id="requestsTable">
                <tr><td colspan="5" class="text-center text-secondary">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- EDIT MODAL (pop-up window) -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Request</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editId">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" id="editTitle" class="form-control" maxlength="100">
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea id="editDescription" class="form-control" rows="4" maxlength="1000"></textarea>
          </div>
          <div id="editMessage"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" id="saveEditBtn" class="btn btn-primary">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/classifier.js"></script>
<script src="js/admin.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
